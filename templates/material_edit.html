{% extends "layout.html" %}
{% block title %}Edit Material — Ledger{% endblock %}

{% block content %}
<div class="record" style="max-width: 640px; margin: 0 auto; padding: 36px;">
  <span class="record__tab">Resource Editor</span>

  <h1 style="font-size: 28px; margin-bottom: 6px;">Edit Course Material</h1>
  <p style="color: var(--ink-soft); margin: 0 0 28px 0; font-size: 14.5px;">Update the resource title, material type, or document link.</p>

  <form method="POST" action="{{ url_for('material_edit', subject_id=subject_id, material_id=material.id) }}">
    <div class="field">
      <label for="title">Material Title</label>
      <input type="text" id="title" name="title" value="{{ material.title }}" required autofocus>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="3">{{ material.description or '' }}</textarea>
    </div>

    <div class="two-col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="field">
        <label for="material_type">Material Type</label>
        <select id="material_type" name="material_type">
          <option value="document" {% if material.material_type == 'document' %}selected{% endif %}>Document</option>
          <option value="presentation" {% if material.material_type == 'presentation' %}selected{% endif %}>Presentation / Slides</option>
          <option value="video" {% if material.material_type == 'video' %}selected{% endif %}>Video Lecture</option>
          <option value="audio" {% if material.material_type == 'audio' %}selected{% endif %}>Audio Podcast</option>
          <option value="image" {% if material.material_type == 'image' %}selected{% endif %}>Image / Diagram</option>
          <option value="other" {% if material.material_type == 'other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div class="field">
        <label for="content_type">Category</label>
        <select id="content_type" name="content_type">
          <option value="official" {% if material.content_type == 'official' %}selected{% endif %}>Official Course Material</option>
          <option value="non-official" {% if material.content_type == 'non-official' or material.content_type == 'not_official' %}selected{% endif %}>Student Contribution</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="file_path">Asset Link / File URL</label>
      <input type="text" id="file_path" name="file_path" value="{{ material.file_path or '' }}" placeholder="https://drive.google.com/..." class="mono">
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button type="submit" class="btn btn--primary" style="flex: 1;">Save Changes</button>
      <a href="{{ url_for('subject_materials', subject_id=subject_id) }}" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
