{% extends "layout.html" %}
{% block title %}Schedule Event — Ledger{% endblock %}

{% block content %}
<div class="record" style="max-width: 640px; margin: 0 auto; padding: 36px;">
  <span class="record__tab">Event Entry</span>

  <h1 style="font-size: 28px; margin-bottom: 6px;">Schedule New Event</h1>
  <p style="color: var(--ink-soft); margin: 0 0 28px 0; font-size: 14.5px;">Publish an exam date, milestone, workshop, or campus deadline.</p>

  <form method="POST" action="{{ url_for('event_add') }}">
    <div class="field">
      <label for="title">Event Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Midterm Examination Period" required autofocus>
    </div>

    <div class="field">
      <label for="description">Event Description</label>
      <textarea id="description" name="description" rows="3" placeholder="Provide guidelines, location, or instructions..."></textarea>
    </div>

    <div class="two-col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="field">
        <label for="event_date">Event Date &amp; Time</label>
        <input type="datetime-local" id="event_date" name="event_date">
      </div>

      <div class="field">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="upcoming" selected>Upcoming</option>
          <option value="ongoing">Ongoing</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </div>

    <div class="two-col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="field">
        <label for="grade">Target Year</label>
        <select id="grade" name="grade">
          <option value="1">Year 1 (All)</option>
          <option value="2">Year 2 (All)</option>
          <option value="3">Year 3 (All)</option>
          <option value="4">Year 4 (All)</option>
        </select>
      </div>

      <div class="field">
        <label for="semester">Target Semester</label>
        <select id="semester" name="semester">
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="url">Resource / Video Call URL (Optional)</label>
      <input type="url" id="url" name="url" placeholder="https://zoom.us/... or campus link">
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button type="submit" class="btn btn--primary" style="flex: 1;">Publish Event</button>
      <a href="{{ url_for('event_list') }}" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
